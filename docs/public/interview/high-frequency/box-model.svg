<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">盒模型示意图</title>
  <desc id="desc">左侧展示标准盒模型，右侧展示 IE 怪异盒模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="100%" stop-color="#f3f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 28px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 500 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #4b5563; }
      .label { font: 700 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #374151; }
      .hint { font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>

  <text x="600" y="56" text-anchor="middle" class="title">CSS 盒模型对比</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">左侧是标准盒模型，右侧是 IE 怪异盒模型</text>

  <!-- Left panel -->
  <g filter="url(#shadow)">
    <rect x="70" y="130" width="500" height="430" rx="24" fill="#ffffff"/>
  </g>
  <text x="320" y="170" text-anchor="middle" class="label">W3C 标准盒模型</text>
  <text x="320" y="195" text-anchor="middle" class="hint">width / height 只计算 content</text>

  <!-- margin -->
  <rect x="130" y="230" width="380" height="270" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="146" y="250" class="small">margin</text>

  <!-- border -->
  <rect x="170" y="270" width="300" height="190" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="14"/>
  <text x="186" y="290" class="small">border</text>

  <!-- padding -->
  <rect x="210" y="310" width="220" height="110" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="226" y="330" class="small">padding</text>

  <!-- content -->
  <rect x="240" y="340" width="160" height="50" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="371" text-anchor="middle" class="label">content</text>

  <!-- left notes -->
  <text x="320" y="508" text-anchor="middle" class="hint">盒子总宽度 = content + padding + border + margin</text>

  <!-- Right panel -->
  <g filter="url(#shadow)">
    <rect x="630" y="130" width="500" height="430" rx="24" fill="#ffffff"/>
  </g>
  <text x="880" y="170" text-anchor="middle" class="label">IE 怪异盒模型</text>
  <text x="880" y="195" text-anchor="middle" class="hint">width / height 计算 content + padding + border</text>

  <!-- margin -->
  <rect x="690" y="230" width="380" height="270" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="706" y="250" class="small">margin</text>

  <!-- border box -->
  <rect x="730" y="270" width="300" height="190" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="14"/>
  <text x="746" y="290" class="small">border-box</text>

  <!-- inner note -->
  <rect x="770" y="310" width="220" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="880" y="349" text-anchor="middle" class="label">content</text>
  <text x="880" y="376" text-anchor="middle" class="small">padding + border 被包含在内</text>

  <text x="880" y="508" text-anchor="middle" class="hint">盒子总宽度 = width/height + margin</text>

  <!-- Footer -->
  <text x="600" y="592" text-anchor="middle" class="hint">示意图用于面试讲解，重点是理解计算方式和空间关系</text>
</svg>
