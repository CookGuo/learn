<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">BFC 清除浮动效果图</title>
  <desc id="desc">左侧展示父元素没有清除浮动时高度塌陷，右侧展示触发 BFC 后父元素包含浮动子元素。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f3f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 26px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .text { font: 600 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .small { font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .label { font: 700 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" class="title">BFC 可以清除浮动，避免父元素高度塌陷</text>

  <g filter="url(#shadow)">
    <rect x="70" y="90" width="500" height="280" rx="22" fill="#fff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="630" y="90" width="500" height="280" rx="22" fill="#fff"/>
  </g>

  <text x="320" y="126" text-anchor="middle" class="label">没有 BFC</text>
  <text x="880" y="126" text-anchor="middle" class="label">触发 BFC 后</text>

  <rect x="150" y="170" width="340" height="70" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="200" text-anchor="middle" class="text">parent</text>
  <text x="320" y="222" text-anchor="middle" class="small">高度塌陷，边框几乎包不住浮动子元素</text>
  <rect x="165" y="182" width="120" height="80" rx="14" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <rect x="295" y="182" width="120" height="80" rx="14" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="225" y="226" text-anchor="middle" class="text">float 1</text>
  <text x="355" y="226" text-anchor="middle" class="text">float 2</text>

  <rect x="710" y="150" width="340" height="150" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="880" y="178" text-anchor="middle" class="text">parent (BFC)</text>
  <text x="880" y="200" text-anchor="middle" class="small">父元素高度由浮动子元素撑开</text>
  <rect x="725" y="190" width="120" height="80" rx="14" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <rect x="855" y="190" width="120" height="80" rx="14" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="785" y="234" text-anchor="middle" class="text">float 1</text>
  <text x="915" y="234" text-anchor="middle" class="text">float 2</text>
  <text x="880" y="318" text-anchor="middle" class="small">`overflow: hidden` / `auto` 等都可以触发 BFC</text>
</svg>
