<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">BFC 与 margin 折叠示意图</title>
  <desc id="desc">三段式示意图，分别解释相邻兄弟元素的 margin 折叠、父子元素的 margin 折叠，以及触发 flow-root 后阻止父子折叠。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcfbf8"/>
      <stop offset="100%" stop-color="#f2f7fc"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <style>
      .title { font: 800 28px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .cardTitle { font: 800 20px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .body { font: 600 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .small { font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .mono { font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #374151; }
      .tag { font: 700 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .thin { stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" class="title">BFC 与 margin 折叠</text>
  <text x="600" y="79" text-anchor="middle" class="subtitle">按你给的三种情况重画：兄弟折叠、父子折叠、以及 `flow-root` 阻断父子折叠</text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="56" y="104" width="1088" height="208" rx="24" fill="url(#cardGlow)"/>
  </g>
  <text x="86" y="140" class="cardTitle">1. 相邻兄弟元素的 margin 折叠</text>
  <text x="86" y="164" class="small">同一个普通块格式化上下文里，两个相邻块级元素的垂直 margin 不是相加，而是折叠成一个值。</text>

  <g>
    <text x="90" y="206" class="mono">.a { height: 50px; margin-bottom: 20px; }</text>
    <text x="90" y="228" class="mono">.b { height: 50px; margin-top: 30px; }</text>
    <text x="90" y="258" class="small">结果不是 20 + 30 = 50px，而是 30px。</text>
  </g>

  <g>
    <rect x="510" y="172" width="340" height="50" rx="12" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="680" y="203" text-anchor="middle" class="body">a</text>
    <rect x="510" y="252" width="340" height="50" rx="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="680" y="283" text-anchor="middle" class="body">b</text>

    <line x1="882" y1="222" x2="882" y2="252" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
    <text x="904" y="242" class="tag" fill="#f59e0b">30px</text>

    <line x1="852" y1="176" x2="852" y2="222" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/>
    <text x="860" y="190" class="tag" fill="#ef4444">20px</text>

    <line x1="852" y1="252" x2="852" y2="228" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
    <text x="860" y="272" class="tag" fill="#3b82f6">30px</text>

    <text x="950" y="198" class="body">最终间距：30px</text>
    <text x="950" y="224" class="small">取两个 margin 里较大的那个</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="56" y="336" width="1088" height="208" rx="24" fill="url(#cardGlow)"/>
  </g>
  <text x="86" y="372" class="cardTitle">2. 父子元素的 margin 折叠</text>
  <text x="86" y="396" class="small">父元素没有 border / padding / overflow / flow-root 等隔离手段时，子元素的 margin-top 会和父元素顶部折叠。</text>

  <g>
    <text x="90" y="438" class="mono">.parent { background: #eee; }</text>
    <text x="90" y="460" class="mono">.child { height: 50px; margin-top: 30px; }</text>
    <text x="90" y="490" class="small">看起来像 child 把 parent “顶下来了”。</text>
  </g>

  <g>
    <line x1="510" y1="432" x2="980" y2="432" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="510" y="422" class="small">页面正常流位置</text>

    <line x1="510" y1="432" x2="510" y2="520" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <text x="528" y="479" class="tag" fill="#f59e0b">child 的 margin-top = 30px</text>

    <rect x="510" y="520" width="370" height="86" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="695" y="544" text-anchor="middle" class="body">parent</text>
    <rect x="530" y="520" width="330" height="50" rx="12" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="695" y="551" text-anchor="middle" class="body">child</text>
    <text x="695" y="594" text-anchor="middle" class="small">child 的 margin 发生了父子折叠，空间出现在 parent 外侧</text>

    <line x1="900" y1="505" x2="900" y2="520" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <text x="918" y="514" class="tag" fill="#f59e0b">30px 空间</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="56" y="568" width="1088" height="208" rx="24" fill="url(#cardGlow)"/>
  </g>
  <text x="86" y="604" class="cardTitle">3. 创建 BFC 后，父子折叠被阻止</text>
  <text x="86" y="628" class="small">`display: flow-root;` 会让 parent 形成新的 BFC，child 的 `margin-top` 不再和父元素顶部折叠。</text>

  <g>
    <text x="90" y="670" class="mono">.parent { display: flow-root; background: #eee; }</text>
    <text x="90" y="692" class="mono">.child { height: 50px; margin-top: 30px; }</text>
    <text x="90" y="722" class="small">30px 的空间会被保留在 parent 内部。</text>
  </g>

  <g>
    <rect x="510" y="644" width="370" height="114" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="695" y="668" text-anchor="middle" class="body">parent</text>
    <text x="695" y="690" text-anchor="middle" class="small">display: flow-root; 形成新的 BFC</text>

    <line x1="530" y1="708" x2="530" y2="732" stroke="#f59e0b" stroke-width="4" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
    <text x="548" y="724" class="tag" fill="#f59e0b">30px</text>

    <rect x="530" y="732" width="330" height="50" rx="12" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="695" y="763" text-anchor="middle" class="body">child</text>
  </g>

  <text x="930" y="682" class="body">结果：</text>
  <text x="930" y="708" class="small">parent 顶部保留 30px</text>
  <text x="930" y="730" class="small">child 不再把 parent 顶下去</text>

  <text x="600" y="824" text-anchor="middle" class="subtitle">结论：兄弟块级元素可能折叠，父子块级元素也可能折叠，而 BFC 主要用来阻止父子折叠并处理 float 相关问题</text>
</svg>
