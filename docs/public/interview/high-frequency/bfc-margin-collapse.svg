<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">BFC 防止 margin 重叠效果图</title>
  <desc id="desc">左侧展示两个普通块级元素的 margin 重叠，右侧展示触发 BFC 后 margin 不再重叠。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f3f7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 26px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .text { font: 600 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #374151; }
      .small { font: 500 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .label { font: 700 18px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" class="title">BFC 可以阻止 margin 重叠</text>

  <g filter="url(#shadow)">
    <rect x="70" y="90" width="500" height="280" rx="22" fill="#fff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="630" y="90" width="500" height="280" rx="22" fill="#fff"/>
  </g>

  <text x="320" y="126" text-anchor="middle" class="label">没有 BFC</text>
  <text x="880" y="126" text-anchor="middle" class="label">触发 BFC 后</text>

  <rect x="175" y="160" width="290" height="60" rx="14" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="320" y="196" text-anchor="middle" class="text">p 1</text>
  <rect x="175" y="236" width="290" height="60" rx="14" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="272" text-anchor="middle" class="text">p 2</text>
  <path d="M 480 220 C 520 220, 520 220, 560 220" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <text x="520" y="212" text-anchor="middle" class="small">margin 合并</text>
  <text x="320" y="328" text-anchor="middle" class="small">两个相邻块的外边距会折叠成一个间距</text>

  <rect x="720" y="152" width="280" height="150" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="860" y="176" text-anchor="middle" class="small">BFC 容器</text>
  <rect x="745" y="190" width="230" height="44" rx="12" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="860" y="217" text-anchor="middle" class="text">p 1</text>
  <rect x="745" y="245" width="230" height="44" rx="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="860" y="272" text-anchor="middle" class="text">p 2</text>
  <text x="880" y="328" text-anchor="middle" class="small">margin 不再折叠，布局更可控</text>
</svg>
