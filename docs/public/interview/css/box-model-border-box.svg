<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="960" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="borderOuter" x1="120" y1="120" x2="610" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="borderInner" x1="190" y1="180" x2="520" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg2)"/>
  <text x="56" y="72" fill="#0F172A" font-size="30" font-weight="700">border-box: width/height 包含 padding 和 border</text>
  <text x="56" y="104" fill="#475569" font-size="17">最终占位更稳定，布局里更常用</text>

  <rect x="128" y="144" width="360" height="220" rx="24" fill="url(#borderOuter)" opacity="0.3"/>
  <rect x="148" y="164" width="320" height="180" rx="22" fill="none" stroke="#059669" stroke-width="3"/>
  <rect x="178" y="194" width="260" height="120" rx="16" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="198" y="214" width="220" height="80" rx="12" fill="url(#borderInner)" stroke="#0F172A" stroke-width="2"/>

  <text x="216" y="261" fill="#0F172A" font-size="22" font-weight="700">content</text>
  <text x="254" y="156" fill="#047857" font-size="16" font-weight="700">margin</text>
  <text x="252" y="178" fill="#059669" font-size="16" font-weight="700">border</text>
  <text x="248" y="201" fill="#10B981" font-size="16" font-weight="700">padding</text>
  <text x="315" y="332" fill="#334155" font-size="16">总宽度 200px</text>

  <rect x="562" y="142" width="332" height="228" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="594" y="182" fill="#0F172A" font-size="22" font-weight="700">示例</text>
  <text x="594" y="220" fill="#334155" font-size="18">width: 200px</text>
  <text x="594" y="252" fill="#334155" font-size="18">height: 100px</text>
  <text x="594" y="284" fill="#334155" font-size="18">padding: 20px</text>
  <text x="594" y="316" fill="#334155" font-size="18">border: 10px solid</text>
  <text x="594" y="348" fill="#334155" font-size="18">box-sizing: border-box</text>
</svg>
