<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">浏览器一帧的执行流程</title>
  <desc id="desc">展示浏览器在约 16.6ms 的一帧内，依次处理输入事件、事件回调、requestAnimationFrame、样式与布局、绘制、合成与显示，并在空闲时执行 requestIdleCallback。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .panelTitle { font: 700 18px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .label { font: 700 15px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .small { font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .tiny { font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>

  <text x="600" y="56" text-anchor="middle" class="title">浏览器一帧会做什么</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">一帧大约 16.6ms，主线程会优先处理输入、回调、渲染，再把空闲时间留给低优先级任务</text>

  <g filter="url(#shadow)">
    <rect x="70" y="120" width="1060" height="420" rx="26" fill="#ffffff"/>
  </g>

  <text x="110" y="164" class="panelTitle">主线程执行顺序</text>
  <text x="110" y="190" class="small">不是每一帧都能执行 requestIdleCallback，只有前面的任务做完后还有剩余时间才会进入空闲期</text>

  <!-- Timeline track -->
  <rect x="110" y="240" width="940" height="26" rx="13" fill="#e2e8f0"/>
  <rect x="110" y="240" width="800" height="26" rx="13" fill="url(#track)"/>
  <text x="110" y="288" class="tiny">0ms</text>
  <text x="488" y="288" class="tiny">8ms</text>
  <text x="850" y="288" class="tiny">16.6ms</text>

  <!-- Process boxes -->
  <g filter="url(#shadow)">
    <rect x="110" y="320" width="140" height="110" rx="18" fill="#fef3c7"/>
    <rect x="280" y="320" width="140" height="110" rx="18" fill="#dcfce7"/>
    <rect x="450" y="320" width="140" height="110" rx="18" fill="#dbeafe"/>
    <rect x="620" y="320" width="140" height="110" rx="18" fill="#ede9fe"/>
    <rect x="790" y="320" width="140" height="110" rx="18" fill="#ffe4e6"/>
    <rect x="960" y="320" width="140" height="110" rx="18" fill="#e0f2fe"/>
  </g>

  <text x="180" y="355" text-anchor="middle" class="label">1. 输入事件</text>
  <text x="180" y="382" text-anchor="middle" class="small">处理点击、滚动、键盘</text>
  <text x="180" y="404" text-anchor="middle" class="tiny">优先级最高</text>

  <text x="350" y="355" text-anchor="middle" class="label">2. 事件回调</text>
  <text x="350" y="382" text-anchor="middle" class="small">执行已排队的回调</text>
  <text x="350" y="404" text-anchor="middle" class="tiny">如 click、timer</text>

  <text x="520" y="355" text-anchor="middle" class="label">3. rAF</text>
  <text x="520" y="382" text-anchor="middle" class="small">requestAnimationFrame</text>
  <text x="520" y="404" text-anchor="middle" class="tiny">渲染前的最后机会</text>

  <text x="690" y="355" text-anchor="middle" class="label">4. 样式 / 布局</text>
  <text x="690" y="382" text-anchor="middle" class="small">计算样式与几何位置</text>
  <text x="690" y="404" text-anchor="middle" class="tiny">可能触发回流</text>

  <text x="860" y="355" text-anchor="middle" class="label">5. 绘制渲染</text>
  <text x="860" y="382" text-anchor="middle" class="small">生成绘制指令</text>
  <text x="860" y="404" text-anchor="middle" class="tiny">paint / composite</text>

  <text x="1030" y="355" text-anchor="middle" class="label">6. 显示</text>
  <text x="1030" y="382" text-anchor="middle" class="small">把结果提交给屏幕</text>
  <text x="1030" y="404" text-anchor="middle" class="tiny">完成这一帧</text>

  <!-- arrows -->
  <path d="M250 375H270" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 375L260 369M270 375L260 381" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M420 375H440" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M440 375L430 369M440 375L430 381" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 375H610" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M610 375L600 369M610 375L600 381" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M760 375H780" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M780 375L770 369M780 375L770 381" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M930 375H950" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M950 375L940 369M950 375L940 381" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- idle callback note -->
  <g filter="url(#shadow)">
    <rect x="860" y="470" width="240" height="50" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  </g>
  <text x="980" y="500" text-anchor="middle" class="label">空闲时间 -> requestIdleCallback</text>
  <text x="980" y="528" text-anchor="middle" class="tiny">前面任务做完后，才处理低优先级工作</text>

  <!-- footer -->
  <text x="110" y="512" class="small">要点：浏览器会尽量把一帧内的时间用在“先保证交互和渲染”，剩余时间再给低优任务。</text>
</svg>
